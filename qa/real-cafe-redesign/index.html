zy" alt="旧スマートフォン画面"></a></figure></div></details><script>document.querySelector('#captures').innerHTML=['index','events','space','journal','contact'].map((p,i)=>`<h2>${['トップ','上映・イベント','場所を借りる','お店だより','お問い合わせ'][i]}</h2><div class="grid">${['desktop','tablet','mobile'].map((size,j)=>`<figure><a href="test-screenshots/${p}-${size}.png"><img src="test-screenshots/${p}-${size}.png" loading="lazy" alt="${p} ${size}"></a><figcaption>${['PC 1440px','タブレット 820px','スマートフォン 390px'][j]}</figcaption></figure>`).join('')}</div>`).join('')</script></html>
